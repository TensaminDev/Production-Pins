name: Stable release

on:
  workflow_dispatch:

concurrency:
  group: tensamin-central-releases
  cancel-in-progress: false

jobs:
  release:
    runs-on: nixos
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
      FORGEJO_REPOSITORY: ${{ forgejo.repository }}
      FORGEJO_RUN_ID: ${{ forgejo.run_id }}
      RELEASE_CHANNEL: stable
      RELEASE_TOKEN: ${{ secrets.TENSAMIN_RELEASE_TOKEN }}
      FORGEJO_REGISTRY_USER: ${{ vars.TENSAMIN_REGISTRY_USER }}
      IOTA_RELEASE_SIGNING_KEY: ${{ secrets.IOTA_RELEASE_SIGNING_KEY }}
      IOTA_RELEASE_PUBLIC_KEY: ${{ vars.IOTA_RELEASE_PUBLIC_KEY }}
      IOTA_RELEASE_SIGNING_KEY_ID: ${{ vars.IOTA_RELEASE_SIGNING_KEY_ID || 'primary' }}
      IOTA_BASE_VERSION: ${{ vars.IOTA_BASE_VERSION || '0.1.0' }}
      NIXOS_FLAKE_REPOSITORY: ${{ vars.NIXOS_FLAKE_REPOSITORY }}
      NIXOS_FLAKE_BRANCH: ${{ vars.NIXOS_FLAKE_BRANCH || 'main' }}
      NIXOS_FLAKE_WRITE_TOKEN: ${{ secrets.NIXOS_FLAKE_WRITE_TOKEN }}
      TENSAMIN_PROD_DEPLOY_SSH_KEY: ${{ secrets.TENSAMIN_PROD_DEPLOY_SSH_KEY }}
      TENSAMIN_PROD_DEPLOY_HOST: ${{ vars.TENSAMIN_PROD_DEPLOY_HOST }}
      TENSAMIN_PROD_DEPLOY_PORT: ${{ vars.TENSAMIN_PROD_DEPLOY_PORT || '22' }}
      TENSAMIN_PROD_DEPLOY_JUMP_HOST: ${{ vars.TENSAMIN_PROD_DEPLOY_JUMP_HOST }}
      TENSAMIN_PROD_DEPLOY_JUMP_PORT: ${{ vars.TENSAMIN_PROD_DEPLOY_JUMP_PORT || '7930' }}
      TENSAMIN_SSH_KNOWN_HOSTS: ${{ vars.TENSAMIN_SSH_KNOWN_HOSTS }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ forgejo.sha }}
      - name: Bootstrap pinned tools and source credentials
        uses: ./.forgejo/source-access
        with:
          source-key: ${{ secrets.TENSAMIN_SOURCE_SSH_KEY }}
          known-hosts: ${{ vars.TENSAMIN_SSH_KNOWN_HOSTS }}
      - name: Select successful canary
        run: bun .forgejo/release/release.ts select
      - name: Prepare release identity
        run: |
          set -euo pipefail
          printf 'RELEASE_SEQUENCE=%s\nRELEASE_TAG=stable-%s-%s\n' "$(date +%s)" "$(git rev-parse HEAD)" "$FORGEJO_RUN_ID" >> "$GITHUB_ENV"
          rm -rf release-out release-arm
      - name: Validate and build release artifacts
        run: |
          build=$(nix build --impure --no-link --print-out-paths --expr 'import ./packages/release-environment.nix { root = builtins.toPath (builtins.getEnv "PWD"); kind = "build"; }')
          nix develop --impure --expr 'import ./packages/release-environment.nix { root = builtins.toPath (builtins.getEnv "PWD"); }' --command bash "$build" stable release-out
      - name: Attempt aarch64 artifacts
        run: |
          set -euo pipefail
          build=$(nix build --impure --no-link --print-out-paths --expr 'import ./packages/release-environment.nix { root = builtins.toPath (builtins.getEnv "PWD"); kind = "build"; }')
          if nix develop --impure --expr 'import ./packages/release-environment.nix { root = builtins.toPath (builtins.getEnv "PWD"); }' --command bash "$build" stable release-arm aarch64-linux > arm-build.log 2>&1; then
            cp release-arm/*linux-aarch64* release-arm/*arm64* release-arm/electron-release-metadata-aarch64.json release-out/
          else
            printf 'aarch64 unavailable. See arm-build.log.\n' > release-out/aarch64-unavailable.txt
            cp arm-build.log release-out/
          fi
      - name: Sign manifests and record provenance
        run: |
          set -euo pipefail
          nix develop --impure --expr 'import ./packages/release-environment.nix { root = builtins.toPath (builtins.getEnv "PWD"); }' --command bun .forgejo/release/release.ts sign --channel stable --tag "$RELEASE_TAG"
          nix develop --impure --expr 'import ./packages/release-environment.nix { root = builtins.toPath (builtins.getEnv "PWD"); }' --command bun .forgejo/release/release.ts provenance --channel stable --tag "$RELEASE_TAG"
      - name: Preserve combined build artifacts
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: combined-release
          path: release-out/
      - name: Stage and verify release attachments
        run: nix develop --impure --expr 'import ./packages/release-environment.nix { root = builtins.toPath (builtins.getEnv "PWD"); }' --command bun .forgejo/release/release.ts stage --channel stable --tag "$RELEASE_TAG"
      - name: Deploy production and publish after health checks
        run: nix develop --impure --expr 'import ./packages/release-environment.nix { root = builtins.toPath (builtins.getEnv "PWD"); }' --command bun .forgejo/release/deploy.ts
      - name: Remove source credentials
        if: always()
        run: |
          if [[ -n ${SSH_AGENT_PID:-} ]]; then kill "$SSH_AGENT_PID"; fi
          rm -rf "$RUNNER_TEMP/tensamin-source"
