name: Deploy selected pins
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      canary_run_id:
        default: ''
        type: string
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Select tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          CANARY_RUN_ID: ${{ inputs.canary_run_id }}
        run: |
          set -euo pipefail
          mkdir -p deployment
          if [[ $CHANNEL == stable ]]; then
            [[ $CANARY_RUN_ID =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANARY_RUN_ID" > deployment/run.json
            jq -e '.conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/canary.yml"' deployment/run.json
            gh run download "$CANARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name canary-deployment --dir deployment
            revision=$(jq -er .pins deployment/manifest.json)
          else
            revision=$GITHUB_SHA
          fi
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          echo "PINS_REVISION=$revision" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: MethaniumDev/NixOS-Flake
          token: ${{ secrets.INFRASTRUCTURE_TOKEN }}
          path: infrastructure
          fetch-depth: 0
          persist-credentials: false
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:tensamin-deploy
      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          FORGEJO_READ_KEY: ${{ secrets.FORGEJO_READ_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$FORGEJO_READ_KEY" > ~/.ssh/forgejo
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            BatchMode yes
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            IdentityFile ~/.ssh/deploy
          Host git.internal.methanium.net
            IdentityFile ~/.ssh/forgejo
            Port 2222
          EOF
      - name: Build, deploy and persist selected channel
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_TOKEN }}
        run: bash scripts/deploy.sh
      - uses: actions/upload-artifact@v4
        if: inputs.channel == 'canary'
        with:
          name: canary-deployment
          path: deployment/manifest.json
          retention-days: 90
      - name: Remove credentials
        if: always()
        run: rm -f ~/.ssh/deploy ~/.ssh/forgejo ~/.ssh/config
