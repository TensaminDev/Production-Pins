name: Deploy selected pins
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  select:
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sequence: ${{ steps.release.outputs.sequence }}
      published_at: ${{ steps.release.outputs.published_at }}
      expires_at: ${{ steps.release.outputs.expires_at }}
      canary_run_id: ${{ steps.release.outputs.canary_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select immutable release identity and check prerequisites
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          IOTA_RELEASE_SIGNING_KEY: ${{ secrets.IOTA_RELEASE_SIGNING_KEY }}
          IOTA_RELEASE_PUBLIC_KEY: ${{ vars.IOTA_RELEASE_PUBLIC_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/select-release.sh

  build:
    needs: select
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    environment: ${{ inputs.channel }}
    env:
      RELEASE_TAG: ${{ needs.select.outputs.tag }}
      RELEASE_SEQUENCE: ${{ needs.select.outputs.sequence }}
      PUBLISHED_AT: ${{ needs.select.outputs.published_at }}
      EXPIRES_AT: ${{ needs.select.outputs.expires_at }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Build and verify Client and Iota
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_SYSTEM: ${{ matrix.system }}
        run: |
          builder=$(nix build --impure --no-update-lock-file --no-link --print-out-paths --expr \
            "import $PWD/packages/release-environment.nix { root = builtins.toPath \"$PWD\"; kind = \"build\"; system = \"$RELEASE_SYSTEM\"; }")
          bash "$builder" "$CHANNEL" build-output "$RELEASE_SYSTEM"
          git diff --exit-code -- flake.lock
      - name: Sign Iota update metadata and validate installers
        env:
          IOTA_RELEASE_SIGNING_KEY: ${{ secrets.IOTA_RELEASE_SIGNING_KEY }}
          IOTA_RELEASE_PUBLIC_KEY: ${{ vars.IOTA_RELEASE_PUBLIC_KEY }}
          RELEASE_SYSTEM: ${{ matrix.system }}
        run: nix develop --no-write-lock-file --command bash scripts/sign-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.system }}
          path: release/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: matrix.system == 'x86_64-linux'
        with:
          name: channel-web
          path: build-output/client-web.tar.gz
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: [select, build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Select tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          CANARY_RUN_ID: ${{ needs.select.outputs.canary_run_id }}
        run: |
          set -euo pipefail
          mkdir -p deployment
          if [[ $CHANNEL == stable ]]; then
            [[ $CANARY_RUN_ID =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANARY_RUN_ID" > deployment/run.json
            jq -e --arg sha "$GITHUB_SHA" '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and .path == ".github/workflows/canary.yml"' deployment/run.json
            gh run download "$CANARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name canary-deployment --dir deployment
            jq -e --arg sha "$GITHUB_SHA" '.pins == $sha' deployment/manifest.json
          fi
          echo "PINS_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: nonanium/NixOS-Flake
          ref: main
          token: ${{ secrets.INFRASTRUCTURE_TOKEN }}
          path: infrastructure
          fetch-depth: 0
          persist-credentials: false
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:tensamin-deploy
      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n $DEPLOY_SSH_KEY && -n $KNOWN_HOSTS ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            BatchMode yes
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            IdentityFile ~/.ssh/deploy
          EOF
      - name: Resolve, validate, push and deploy selected channel
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_TOKEN }}
        run: |
          set -euo pipefail
          # Keep the existing GitHub read token out of checkout and command output.
          export NIX_CONFIG="access-tokens = github.com=$GH_TOKEN"
          bash scripts/deploy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.channel }}-deployment
          path: deployment/manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove credentials
        if: always()
        run: rm -f ~/.ssh/deploy ~/.ssh/config

  web:
    needs: [select, build, deploy]
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: channel-web
          path: web-artifact
      - name: Prepare static-only Pages deployment
        run: |
          mkdir web
          tar -xzf web-artifact/client-web.tar.gz -C web
          chmod -R u+w web
          python3 scripts/prepare-pages.py
      - name: Create the channel's free Pages project if needed
        env:
          CHANNEL: ${{ inputs.channel }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/create-pages-project.py
      - name: Deploy static web app to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.93.0'
          command: pages deploy web --project-name=tensamin-${{ inputs.channel }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false

  publish:
    needs: [select, build, deploy, web]
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish immutable release and advance channel metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
          RELEASE_SEQUENCE: ${{ needs.select.outputs.sequence }}
          IOTA_RELEASE_PUBLIC_KEY: ${{ vars.IOTA_RELEASE_PUBLIC_KEY }}
        run: bash scripts/publish-release.sh
